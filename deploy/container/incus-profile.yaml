# =============================================================================
# OP-DBUS / 3tched Hardened Incus Profile
# Profile Name: opdbus-3tched-3tchedchatbot
# Host Control Plane: Devuan GNU/Linux (runit, D-Bus Control)
# Principle: "The container is the identity; 3tchedFS is its lungs."
# =============================================================================
name: opdbus-3tched-3tchedchatbot
description: "SID1 Identity Container Profile for 3tchedChatbot on Devuan GNU/Linux (runit, D-Bus Control). No network interface; lungs at /run/opdbus, egress at /run/opdbus-egress."
config:
  limits.cpu: "4"
  limits.memory: "8GiB"
  limits.memory.enforce: "hard"
  security.privileged: "false"
  security.nesting: "false"
  security.idmap.isolated: "true"
  security.idmap.base: "1000000"
  security.idmap.size: "65536"
  security.syscalls.deny_default: "true"
  security.syscalls.deny: |
    socket(AF_PACKET)
    perf_event_open
    kexec_load
    init_module
    finit_module
  raw.lxc: |
    lxc.cap.drop = net_admin net_raw sys_module sys_rawio sys_time
    lxc.mount.auto = proc:mixed sys:ro cgroup:mixed
  environment.OPDBUS_HOST_OS: "Devuan GNU/Linux (runit, D-Bus Control)"
  environment.OPDBUS_SID_VERSION: "SID1"
  environment.OPDBUS_LUNGS_SOCK: "/run/opdbus/lungs/lungs.sock"
  environment.ETCHEDFS_MOUNT: "/opt/run-mounts/3tched"
  # op-cozo-store from_env(): unset means in-memory. Store lives on the ext4 mount.
  # Btrfs is OS persistence (seed + sprout). /var/lib/rocksdb is the durable
  # store for any code that keeps user state.
  # The sled (snowball and its identity-cozo fork) is a rw mount from the
  # host's /run tmpfs: not durable; it is mutated at vectorization and reset.
  environment.COGNITIVE_COZO_DB_PATH: "/var/lib/rocksdb/cozo"
  environment.IDENTITY_SLED_COZO_DB_PATH: "/run/opdbus-sled/identity-cozo"
  environment.OPDBUS_SNOWBALL_PATH: "/run/opdbus-sled"
  environment.http_proxy: "http://127.0.0.1:3128"
  environment.https_proxy: "http://127.0.0.1:3128"
  environment.HTTP_PROXY: "http://127.0.0.1:3128"
  environment.HTTPS_PROXY: "http://127.0.0.1:3128"
  environment.no_proxy: "localhost,127.0.0.1,/run/opdbus/lungs/lungs.sock"
  user.opdbus.seed: "/dev/sda4 sealed Btrfs, Ubuntu 26.04 (ro lower)"
  user.opdbus.upgrade: "/dev/sda5 @ (ro lower, above seed)"

devices:
  # No nic device: the container has only lo. Lungs and egress are its only
  # paths out.

  # Root: Incus filesystem volume on 3tched-pool (150G sparse loop, Incus-owned).
  # Per-container mounts (RocksDB volume, seed/upgrade lowers,
  # /agent directories) are instance devices set by container-provision.sh,
  # because their sources live in the per-container Cozo root.
  root:
    path: /
    pool: 3tched-pool
    type: disk
    size: "20GiB"

  # ---------------------------------------------------------------------------
  # 4. Lungs socket directory, same path on host and guest. The socket path
  #    /run/opdbus/lungs/lungs.sock is fixed by the sealed seed (3tchedfs-guest).
  # ---------------------------------------------------------------------------
  opdbus-lungs-socket:
    path: /run/opdbus
    source: /run/opdbus
    type: disk
    readonly: false
    shift: true

  # ---------------------------------------------------------------------------
  # 5. 3tchedFS Typed Operation Hierarchy
  # ---------------------------------------------------------------------------
  etched-fs-tree:
    path: /opt/run-mounts/3tched
    source: /run/mounts/3tched/3tchedChatbot
    type: disk
    readonly: false

  # ---------------------------------------------------------------------------
  # 6. Outbound Egress UNIX Domain Socket (runit socat -> host egress)
  # ---------------------------------------------------------------------------
  opdbus-egress-socket:
    path: /run/opdbus-egress
    source: /run/opdbus-egress
    type: disk
    readonly: false

