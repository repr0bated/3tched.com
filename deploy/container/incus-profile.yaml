# =============================================================================
# OP-DBUS / 3tched Hardened Incus Profile
# Profile Name: opdbus-3tched-3tchedchatbot
# Host Control Plane: Devuan GNU/Linux (runit, D-Bus Control)
# Principle: "The container is the identity; 3tchedFS is its lungs."
# =============================================================================
name: opdbus-3tched-3tchedchatbot
description: "SID1 Identity Container Profile for 3tchedChatbot on Devuan GNU/Linux (runit, D-Bus Control) (b0c777e3-8f42-4d91-9e1a-7c3b5a9e1201). eth0 is an OVS port on ovsbr0."
config:
  limits.cpu: "4"
  limits.memory: "8GiB"
  limits.memory.enforce: "hard"
  security.privileged: "false"
  security.nesting: "false"
  security.idmap.isolated: "true"
  security.idmap.base: "1000000"
  security.idmap.size: "65536"
  security.syscalls.deny_default: "true"
  security.syscalls.deny: |
    socket(AF_PACKET)
    bpf
    perf_event_open
    kexec_load
    init_module
    finit_module
  raw.lxc: |
    lxc.cap.drop = net_admin net_raw sys_module sys_rawio sys_time
    lxc.mount.auto = proc:mixed sys:ro cgroup:mixed
  environment.CONTAINER_IDENTITY: "3tchedChatbot"
  environment.OPDBUS_HOST_OS: "Devuan GNU/Linux (runit, D-Bus Control)"
  environment.OPDBUS_SESSION_UUID: "b0c777e3-8f42-4d91-9e1a-7c3b5a9e1201"
  environment.OPDBUS_PRINCIPAL_ID: "princ_blake3_7f9a2c41e80b3d19a65e0c21"
  environment.OPDBUS_SID_VERSION: "SID1"
  environment.OPDBUS_LUNGS_SOCK: "/opt/run-mounts/ghostbridge/lungs.sock"
  environment.ETCHEDFS_MOUNT: "/opt/run-mounts/3tched"
  environment.COZO_ROCKSDB_PATH: "/var/lib/rocksdb"
  environment.http_proxy: "http://127.0.0.1:3128"
  environment.https_proxy: "http://127.0.0.1:3128"
  environment.HTTP_PROXY: "http://127.0.0.1:3128"
  environment.HTTPS_PROXY: "http://127.0.0.1:3128"
  environment.no_proxy: "localhost,127.0.0.1,/opt/run-mounts/ghostbridge/lungs.sock"
  user.opdbus.seed: "/dev/sda4 sealed Btrfs, Ubuntu 26.04 (ro lower)"
  user.opdbus.upgrade: "/dev/sda5 @ (ro lower, above seed)"

devices:
  eth0:
    name: eth0
    network: ovsbr0
    type: nic

  # Root: Incus filesystem volume on 3tched-pool (150G sparse loop, Incus-owned).
  # Per-container mounts (RocksDB ext4, snowball ledger, seed/upgrade lowers,
  # /agent directories) are instance devices set by container-provision.sh,
  # because their sources live in the per-container Cozo root.
  root:
    path: /
    pool: 3tched-pool
    type: disk
    size: "20GiB"

  # ---------------------------------------------------------------------------
  # 4. 3tchedFS Lungs Control Socket (Host op-grpc-bridge -> Container)
  # ---------------------------------------------------------------------------
  opdbus-lungs-socket:
    path: /opt/run-mounts/ghostbridge
    source: /run/opdbus
    type: disk
    readonly: false

  # ---------------------------------------------------------------------------
  # 5. 3tchedFS Typed Operation Hierarchy
  # ---------------------------------------------------------------------------
  etched-fs-tree:
    path: /opt/run-mounts/3tched
    source: /run/mounts/3tched/3tchedChatbot
    type: disk
    readonly: false

  # ---------------------------------------------------------------------------
  # 6. Outbound Egress UNIX Domain Socket (runit socat -> Xray/WARP)
  # ---------------------------------------------------------------------------
  opdbus-egress-socket:
    path: /run/opdbus-egress
    source: /run/opdbus-egress
    type: disk
    readonly: false

