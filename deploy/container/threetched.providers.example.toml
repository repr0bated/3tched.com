# Example threetched (ZeroClaw) provider config fragment for this container.
#
# There is no live threetched config checked into this repo; the binary's
# real config lives with the threetched/ZeroClaw install on the host (or is
# written at deploy time via `threetched config.set` / scripts/configure-providers.sh).
# Merge this fragment into that config, or apply the same keys with config.set.
#
# Salad is not a first-class ZeroClaw slot — use the `custom` OpenAI-compatible
# family. Chat_Route does not call Salad HTTP itself; it hands generation to
# threetched over zeroclaw.v1 on loopback, and threetched selects the provider.

[providers.models.custom.salad]
# OpenAI-compatible Salad AI Gateway base URL (must include /v1).
uri = "https://ai.salad.cloud/v1"
# Default model id for this alias; override per agent or at runtime as needed.
model = "qwen3.6-35b-a3b"

# api_key: NEVER put a literal key in this file or in git.
# Prefer SALAD_AI_GATEWAY_API_KEY; fall back to SALAD_API_KEY.
#
# Inject either:
#   1) ZeroClaw schema-mirror env at process start:
#        export ZEROCLAW_providers__models__custom__salad__api_key="${SALAD_AI_GATEWAY_API_KEY:-$SALAD_API_KEY}"
#   2) Or via threetched config.set (see scripts/configure-providers.sh):
#        providers.models.custom.salad_api_key = <from env, never committed>


# Point an agent at Salad (example — adjust agent name to your install):
# [agents.default]
# model_provider = "custom.salad"
